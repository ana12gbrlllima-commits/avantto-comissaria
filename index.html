function migrate(i) {
  if (i.locations) return i;
  const s = i.stock ?? 0;
  return {
    ...i,
    locations: {
      ...EMPT_L,
      "Armário": s
    }
  };
}
function total(i) {
  return Object.values(i.locations || {}).reduce((a, b) => a + (b || 0), 0);
}
function getStatus(i) {
  const s = total(i);
  if (s === 0) return {
    label: "Esgotado",
    color: "#f87171",
    bg: "rgba(248,113,113,.15)",
    dot: "#ef4444"
  };
  if (s <= 5) return {
    label: "Crítico",
    color: "#fb923c",
    bg: "rgba(251,146,60,.15)",
    dot: "#f97316"
  };
  if (s <= 15) return {
    label: "Necessário",
    color: "#c084fc",
    bg: "rgba(192,132,252,.15)",
    dot: "#a855f7"
  };
  return {
    label: "Em estoque",
    color: "#4ade80",
    bg: "rgba(74,222,128,.15)",
    dot: "#22c55e"
  };
}
function fmtTs(ts) {
  if (!ts) return "";
  return new Date(ts).toLocaleString("pt-BR", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}
function validadeStatus(v) {
  if (!v) return null;
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const val = new Date(v + "T00:00:00");
  const diff = Math.floor((val - hoje) / (1000 * 60 * 60 * 24));
  if (diff < 0) return {
    label: "VENCIDO",
    color: "#f87171",
    bg: "rgba(248,113,113,.2)",
    dias: diff
  };
  if (diff <= 7) return {
    label: "VENCE EM " + diff + "d",
    color: "#fb923c",
    bg: "rgba(251,146,60,.2)",
    dias: diff
  };
  if (diff <= 30) return {
    label: "VENCE EM " + diff + "d",
    color: "#facc15",
    bg: "rgba(250,204,21,.15)",
    dias: diff
  };
  return null;
}
function fmtValidade(v) {
  if (!v) return "";
  const [y, m, d] = v.split("-");
  return `${d}/${m}/${y}`;
}

// ─── Firebase helpers ────────────────────────────────────────────────────────
const DB = {
  async set(col, docId, data) {
    try {
      const db = firebase.firestore();
      await db.collection(col).doc(docId).set(data);
      return true;
    } catch (e) {
      console.warn("FB set error:", e);
      return false;
    }
  },
  async get(col, docId) {
    try {
      const db = firebase.firestore();
      const snap = await db.collection(col).doc(docId).get();
      return snap.exists ? snap.data() : null;
    } catch (e) {
      console.warn("FB get error:", e);
      return null;
    }
  },
  subscribe(col, docId, cb) {
    try {
      const db = firebase.firestore();
      return db.collection(col).doc(docId).onSnapshot(snap => {
        if (snap.exists) cb(snap.data());
      }, () => {});
    } catch (e) {
      console.warn("FB subscribe error:", e);
      return () => {};
    }
  }
};
function lc(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}
function ls(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}
function lp(key) {
  try {
    const v = lc(key);
    return v ? JSON.parse(v) : null;
  } catch (e) {
    return null;
  }
}
